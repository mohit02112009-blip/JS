<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
    <style>

        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

form{
    width:450px;
    padding:35px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
    color:white;
}

form::before{
    content:"Admission Form";
    display:block;
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-bottom:25px;
    letter-spacing:1px;
}

span{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    font-size:15px;
}

input[type="text"],
input[type="number"]{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
    margin-bottom:5px;
    transition:0.3s;
}

input::placeholder{
    color:rgba(255,255,255,0.8);
}

input[type="text"]:focus,
input[type="number"]:focus{
    background:rgba(255,255,255,0.3);
    transform:scale(1.02);
    box-shadow:0 0 15px rgba(255,255,255,0.3);
}

input[type="submit"]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#764ba2;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    margin-top:15px;
    transition:0.3s;
}

input[type="submit"]:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.error{
    display:block;
    color:#f74242;
    font-size:13px;
    margin-bottom:15px;
}
    </style>
</head>

<body>
    <!--Form Validation-->
    <form onsubmit="return validateForm()">
        <span>Name:</span>
        <input type="text" placeholder="Enter your username" id="Name">
        <span id="name_error" class="error"></span>
        <br>
        <br>
        <span>Email:</span>
        <input type="text" placeholder="Enter your email" id="Email">
        <span id="email_error" class="error"></span>
        <br>
        <br>
        <span>Contact:</span>
        <input type="number" placeholder="Enter your contact" id="Contact">
        <span id="contact_error" class="error"></span>
        <br>
        <br>
        <span>Course:</span>
        <input type="text" placeholder="Enter your Course" id="Course">
        <span id="course_error" class="error"></span>
        <br>
        <br>

        <input type="submit" value="Submit Form">
    </form>

    <script>
        function validateForm() {
            let isValid = true;

            document.getElementById("name_error").innerHTML = "";
            document.getElementById("email_error").innerHTML = "";
            document.getElementById("contact_error").innerHTML = "";
            document.getElementById("course_error").innerHTML = "";

            let name = document.getElementById("Name").value.trim();
            let email = document.getElementById("Email").value.trim();
            let contact = document.getElementById("Contact").value.trim();
            let course = document.getElementById("Course").value.trim();

            if (name === "") {
                document.getElementById("name_error").innerHTML = "Name is required";
                isValid = false;
            }

            if (email === "") {
                document.getElementById("email_error").innerHTML = "Email is required";
                isValid = false;
            }

            if (contact === "") {
                document.getElementById("contact_error").innerHTML = "Contact is required";
                isValid = false;
            }

            if (course === "") {
                document.getElementById("course_error").innerHTML = "Course is required";
                isValid = false;
            }

            return isValid;
        }

    </script>
</body>

</html>
