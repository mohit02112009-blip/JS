<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e293b, #0f172a 60%);
        }

        .container {
            width: 450px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(59, 130, 246, 0.15);
        }

        .container h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .input-box input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Password Rules */

        .rules {
            list-style: none;
            margin-top: 15px;
        }

        .rules li {
            color: #cbd5e1;
        }

        .rules li.valid {
            color: #22c55e;
        }

        /* Show Password */

        .Show-Password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .Show-Password input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .Show-Password label {
            cursor: pointer;
        }

        /* Button */

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Message */

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }

        .valid {
            color: #22c55e;
        }

        .invalid {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Password</h2>
        <div class="input-box">
            <input type="password" placeholder="Enter your Password" id="Password">
            <ul class="rules">
                <li id="lower">At least 1 lowercase letter</li>
                <li id="upper">At least 1 uppercase letter</li>
                <li id="number">At least 1 number</li>
                <li id="special">At least 1 special character</li>
                <li id="length">Minimum 8 characters</li>
            </ul>
        </div>

        <div class="Show-Password">
            <input type="checkbox" id="Showpass">
            <label for="ShowPass">Show Password</label>
        </div>


        <button onclick="checkPassword()">Validate Password</button>

        <p id="message"></p>
    </div>

    <script>
        const password = document.getElementById("Password");
        const showPass = document.getElementById("Showpass");
        const message = document.getElementById("message");

        // Show / Hide Password
        showPass.addEventListener("change", function () {
            password.type = this.checked ? "text" : "password";
        });

        // Live Validation
        password.addEventListener("input", function () {
            let value = password.value;

            updateRule("lower", /[a-z]/.test(value));
            updateRule("upper", /[A-Z]/.test(value));
            updateRule("number", /\d/.test(value));
            updateRule("special", /[@$!%*?&]/.test(value));
            updateRule("length", value.length >= 8);
        });

        // Update Tick/Cross
        function updateRule(id, valid) {
            const element = document.getElementById(id);

            const text = { 
                lower: "At least 1 lowercase letter",
                upper: "At least 1 uppercase letter",
                number: "At least 1 number",
                special: "At least 1 special character",
                length: "Minimum 8 characters"
            };

            if (valid) {
                element.innerHTML = "✅ " + text[id];
                element.classList.add("valid");
            } else {
                element.innerHTML = text[id];
                element.classList.remove("valid");
            }
        }

        // Button Validation
        function checkPassword() {
            let pass = password.value;

            let pattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

            if (pattern.test(pass)) {
                message.innerHTML = "✅ Valid Password";
                message.className = "valid";
            } else {
                message.innerHTML = "❌ Invalid Password";
                message.className = "invalid";
            }
        }
    </script>
</body>

</html>
